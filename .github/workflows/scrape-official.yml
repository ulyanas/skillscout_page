name: Scrape & deploy official skills

on:
  schedule:
    - cron: '0 6,18 * * *'   # 6 AM and 6 PM UTC
  workflow_dispatch:           # manual trigger from GitHub UI

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape catalog + stars
        run: node scripts/scrape_official_skills.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_SKILLS_OUTPUT: docs/data/official-skills-universal.json

      - name: Import Doist official skills
        run: node scripts/import_doist_skills.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_SKILLS_OUTPUT: docs/data/official-skills-universal.json

      - name: Enrich with GitHub skill trees
        run: node scripts/enrich_github_skills.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_SKILLS_OUTPUT: docs/data/official-skills-universal.json

      - name: Import Skillscout ClawHub stats
        run: node scripts/import_skillscout_clawhub_skill.mjs
        env:
          OFFICIAL_SKILLS_OUTPUT: docs/data/official-skills-universal.json

      - name: Import Obsidian official skills
        run: node scripts/import_obsidian_skills.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_SKILLS_OUTPUT: docs/data/official-skills-universal.json

      - name: Enrich owner metadata
        run: node scripts/enrich_owner_metadata.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANIES_API_KEY: ${{ secrets.COMPANIES_API_KEY }}
          OFFICIAL_SKILLS_OUTPUT: docs/data/official-skills-universal.json

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions"
          git add docs/data/official-skills-universal.json
          git diff --staged --quiet || git commit -m "chore: refresh official skills data"
          git push

      - name: Build static site and vendor pages
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
