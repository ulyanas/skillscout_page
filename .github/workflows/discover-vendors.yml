name: Discover & add new skill vendors

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily — runs before the 06:00 scrape
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover & add verified vendors
        run: node scripts/auto_add_vendors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANIES_API_KEY: ${{ secrets.COMPANIES_API_KEY }}
          OFFICIAL_SKILLS_OUTPUT: docs/data/official-skills-universal.json
          DISCOVERY_WINDOW_DAYS: '45'
          DISCOVERY_SEARCH_PAGES: '2'
          DISCOVERY_MAX_CANDIDATES: '600'
          DISCOVERY_REJECTION_SAMPLE_LIMIT: '5'
          DISCOVERY_REPORTS_OUTPUT: .discovery-reports

      - name: Enrich skill trees + star counts
        run: node scripts/enrich_github_skills.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_SKILLS_OUTPUT: docs/data/official-skills-universal.json

      - name: Commit and push if vendors were added
        id: commit-data
        run: |
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions"
          git add docs/data/official-skills-universal.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No discovery output changed"
            exit 0
          fi
          git commit -m "chore: refresh discovered skill data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build static site and vendor pages
        if: steps.commit-data.outputs.changed == 'true'
        run: npm run build:pages

      - name: Configure GitHub Pages
        if: steps.commit-data.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.commit-data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

      - name: Deploy GitHub Pages
        if: steps.commit-data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
