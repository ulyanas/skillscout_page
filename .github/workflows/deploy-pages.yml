name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/build-pages.mjs"
      - "scripts/indexnow.mjs"
      - "scripts/homepage-stats.mjs"
      - "scripts/generate-vendor-pages.mjs"
      - "package.json"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify site generation and vendor data
        run: node --test tests/*.test.mjs

      - name: Build static site and vendor pages
        run: npm run build:pages

      - name: Prepare changed URLs for IndexNow
        run: node scripts/indexnow.mjs prepare

      - name: Save IndexNow submission list
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: .indexnow-urls.json
          include-hidden-files: true
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Bing IndexNow
        run: node scripts/indexnow.mjs submit
